name: Deploy SubmitReady to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'projects/submit-ready/artifacts/web/**'
      - '.github/workflows/submit-ready-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: submit-ready-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/submit-ready/artifacts/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/submit-ready/artifacts/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
